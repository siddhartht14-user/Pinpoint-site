.pp{--bg:#0a0a0c;--fg:#f4f2ee;--dim:rgba(244,242,238,.5);--line:rgba(255,255,255,.13);--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--warn:#e0736a}
.pp[data-theme="light"]{--bg:#f6f5f1;--fg:#141519;--dim:rgba(20,21,25,.52);--line:rgba(0,0,0,.11);--card:rgba(0,0,0,.045);--card2:rgba(0,0,0,.08);--warn:#b8433a}
.pp{font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.pp input,.pp button{font-family:inherit}
.pp a{color:inherit;text-decoration:none}
.pp input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:var(--line);outline:none;margin:0}
.pp input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg);border:none;cursor:pointer}
.pp input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--fg);border:none;cursor:pointer}
/* the gesture belongs to the board, so nothing inside it may claim a touch \u2014
   this has to reach every descendant, not just the container */
.pp .board,.pp .board *{touch-action:none}
.pp .board{overscroll-behavior:contain;-webkit-tap-highlight-color:transparent}
.pp .board a{-webkit-touch-callout:none;-webkit-user-drag:none;user-drag:none;-webkit-user-select:none;user-select:none}
.pp .glass{background:rgba(18,18,22,.52);-webkit-backdrop-filter:blur(22px) saturate(165%);backdrop-filter:blur(22px) saturate(165%);border:1px solid rgba(255,255,255,.16);box-shadow:0 1px 0 rgba(255,255,255,.10) inset,0 16px 44px rgba(0,0,0,.5)}
.pp[data-theme="light"] .glass{background:rgba(252,251,248,.62);border-color:rgba(0,0,0,.10);box-shadow:0 1px 0 rgba(255,255,255,.65) inset,0 16px 40px rgba(0,0,0,.16)}
/* frosting needs something behind it; without support the bar would read as a
   pale smear over the tiles, so fall back to the solid surface token */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
.pp .glass{background:var(--bg);border-color:var(--line)}}
.pp .glass input[type=range]{height:4px;background:var(--line)}
.pp .glass input[type=range]::-webkit-slider-thumb{width:22px;height:22px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pp .glass input[type=range]::-moz-range-thumb{width:22px;height:22px}
.pp .burger{display:flex;flex-direction:column;justify-content:center;gap:4px;align-items:center}
.pp .burger i{display:block;width:16px;height:1.5px;border-radius:1px;background:currentColor;transition:transform .22s ease,opacity .18s ease}
.pp .burger[data-open="1"] i:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
.pp .burger[data-open="1"] i:nth-child(2){opacity:0}
.pp .burger[data-open="1"] i:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}
@media (prefers-reduced-motion:reduce){.pp .burger i,.pp .drawer{transition:none}}
@keyframes ppPulse{0%{transform:scale(1);opacity:.45}70%{transform:scale(1.55);opacity:0}100%{transform:scale(1.55);opacity:0}}
.pp ::-webkit-scrollbar{width:8px;height:8px}.pp ::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:4px}
