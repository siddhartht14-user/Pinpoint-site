<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinpoint - phone view</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#141416;
    font-family:'DM Sans',system-ui,-apple-system,sans-serif; color:#e8e6e2; }
  .wrap { min-height:100%; box-sizing:border-box; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:26px 16px 34px; }
  .cap { font:500 12px/1.5 ui-monospace,monospace; letter-spacing:.18em;
    text-transform:uppercase; color:rgba(232,230,226,.42); text-align:center; }
  .sizes { display:flex; gap:6px; }
  .sizes button { font:500 11.5px/1 ui-monospace,monospace; letter-spacing:.08em;
    padding:8px 12px; border-radius:9px; cursor:pointer; color:#e8e6e2;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.13); }
  .sizes button[data-on] { background:#e8e6e2; color:#141416; border-color:transparent; }
  /* the bezel is a transformed ancestor on purpose: it makes the drawer's
     position:fixed resolve against the phone instead of the browser window,
     so the preview behaves the way the real viewport would */
  .device { position:relative; width:393px; height:852px; flex:none;
    padding:11px; border-radius:56px; background:#0d0d0f;
    transform:translateZ(0);
    box-shadow:0 0 0 1.5px rgba(255,255,255,.16), 0 0 0 11px #1c1c1f,
      0 44px 90px rgba(0,0,0,.72);
    transition:width .28s cubic-bezier(.4,0,.2,1), height .28s cubic-bezier(.4,0,.2,1); }
  .screen { position:relative; width:100%; height:100%; border-radius:45px;
    overflow:hidden; background:#0a0a0c; }
  .pill { position:absolute; z-index:200; top:9px; left:50%; transform:translateX(-50%);
    width:104px; height:29px; border-radius:15px; background:#0a0a0c; pointer-events:none; }
  .home { position:absolute; z-index:200; bottom:7px; left:50%; transform:translateX(-50%);
    width:128px; height:4px; border-radius:2px; background:rgba(255,255,255,.32); pointer-events:none; }
  #root { height:100%; padding-top:34px; box-sizing:border-box; }
  @media (max-width:520px){ .device{ transform:scale(.82) translateZ(0); transform-origin:top center; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="sizes">
    <button data-w="360" data-h="800">360 - ANDROID</button>
    <button data-w="393" data-h="852" data-on="1">393 - IPHONE</button>
    <button data-w="430" data-h="932">430 - PRO MAX</button>
  </div>
  <div class="device" id="device">
    <div class="screen">
      <div class="pill"></div>
      <div id="root"></div>
      <div class="home"></div>
    </div>
  </div>
  <div class="cap">Tap the three-line button for the panel - drag the glass bar to filter</div>
</div>

.pp{--bg:#0a0a0c;--fg:#f4f2ee;--dim:rgba(244,242,238,.5);--line:rgba(255,255,255,.13);--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1)}
.pp[data-theme="light"]{--bg:#f6f5f1;--fg:#141519;--dim:rgba(20,21,25,.52);--line:rgba(0,0,0,.11);--card:rgba(0,0,0,.045);--card2:rgba(0,0,0,.08)}
.pp{font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.pp input,.pp button{font-family:inherit}
.pp a{color:inherit;text-decoration:none}
.pp input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:var(--line);outline:none;margin:0}
.pp input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg);border:none;cursor:pointer}
.pp input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--fg);border:none;cursor:pointer}
.pp .glass{background:rgba(18,18,22,.52);-webkit-backdrop-filter:blur(22px) saturate(165%);backdrop-filter:blur(22px) saturate(165%);border:1px solid rgba(255,255,255,.16);box-shadow:0 1px 0 rgba(255,255,255,.10) inset,0 16px 44px rgba(0,0,0,.5)}
.pp[data-theme="light"] .glass{background:rgba(252,251,248,.62);border-color:rgba(0,0,0,.10);box-shadow:0 1px 0 rgba(255,255,255,.65) inset,0 16px 40px rgba(0,0,0,.16)}
/* frosting needs something behind it; without support the bar would read as a
   pale smear over the tiles, so fall back to the solid surface token */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
.pp .glass{background:var(--bg);border-color:var(--line)}}
.pp .glass input[type=range]{height:4px;background:var(--line)}
.pp .glass input[type=range]::-webkit-slider-thumb{width:22px;height:22px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pp .glass input[type=range]::-moz-range-thumb{width:22px;height:22px}
.pp .burger{display:flex;flex-direction:column;justify-content:center;gap:4px;align-items:center}
.pp .burger i{display:block;width:16px;height:1.5px;border-radius:1px;background:currentColor;transition:transform .22s ease,opacity .18s ease}
.pp .burger[data-open="1"] i:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
.pp .burger[data-open="1"] i:nth-child(2){opacity:0}
.pp .burger[data-open="1"] i:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}
@media (prefers-reduced-motion:reduce){.pp .burger i,.pp .drawer{transition:none}}
@keyframes ppPulse{0%{transform:scale(1);opacity:.45}70%{transform:scale(1.55);opacity:0}100%{transform:scale(1.55);opacity:0}}
.pp ::-webkit-scrollbar{width:8px;height:8px}.pp ::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:4px}
